<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskForge{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 760px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.5;
      color: #1f2328; background: #ffffff;
    }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    h1 { font-size: 1.6rem; margin: 0; }
    .badge {
      background: #0969da; color: #fff; border-radius: 999px;
      padding: 0.15rem 0.7rem; font-size: 0.85rem; font-weight: 600; white-space: nowrap;
    }
    form.inline { display: inline; }
    .card { border: 1px solid #d0d7de; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    input[type=text], textarea {
      width: 100%; padding: 0.5rem; border: 1px solid #d0d7de; border-radius: 6px;
      font: inherit; margin-bottom: 0.5rem;
    }
    button {
      font: inherit; cursor: pointer; border: 1px solid #d0d7de; border-radius: 6px;
      padding: 0.35rem 0.8rem; background: #f6f8fa;
    }
    button.primary { background: #1f883d; color: #fff; border-color: #1f883d; }
    ul.tasks { list-style: none; padding: 0; margin: 0; }
    li.task {
      display: flex; align-items: center; gap: 0.6rem;
      border-top: 1px solid #eaeef2; padding: 0.6rem 0;
    }
    li.task:first-child { border-top: none; }
    .task .title { flex: 1; }
    .task.done .title { text-decoration: line-through; color: #6e7781; }
    .status { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em;
              color: #6e7781; border: 1px solid #d0d7de; border-radius: 999px; padding: 0 0.5rem; }
    .messages { padding: 0; list-style: none; }
    .messages li { padding: 0.5rem 0.8rem; border-radius: 6px; margin: 0.3rem 0; background: #ddf4ff; }
    footer { margin-top: 2rem; color: #6e7781; font-size: 0.85rem; }
    a { color: #0969da; }
  </style>
</head>
<body>
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li>{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
  <footer>
    TaskForge — a demo app for GitHub agentic development.
    JSON API at <a href="/api/tasks/">/api/tasks/</a>.
  </footer>
</body>
</html>
